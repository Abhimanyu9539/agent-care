{% extends "base.html" %}
{% block title %}Register - AgentCare{% endblock %}
{% block content %}
<h1>Register as a patient</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/auth/register">
  <label>Full name <input name="full_name" value="{{ form.full_name }}" required autofocus></label>
  <label>Email <input type="email" name="email" value="{{ form.email }}" required></label>
  <label>Password (at least 8 characters) <input type="password" name="password" minlength="8" required></label>
  <label>Date of birth <input type="date" name="date_of_birth" value="{{ form.date_of_birth }}" required></label>
  <label>Phone <input type="tel" name="phone" value="{{ form.phone }}" required></label>
  <button type="submit">Register</button>
</form>
<p>Already registered? <a href="/auth/login">Log in</a></p>
{% endblock %}
