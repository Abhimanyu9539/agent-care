<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AgentCare{% endblock %}</title>
  <style>
    /* Minimal styling in the UI design's colours: ground, ink, care teal, urgent. */
    body { margin: 0; background: #F5F6F3; color: #15201C; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 26rem; margin: 3rem auto; padding: 0 1rem; }
    main.wide { max-width: 56rem; }
    h1 { font-size: 1.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .4rem .6rem; border-bottom: 1px solid #C8CDC9; text-align: left; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea { display: block; width: 100%; box-sizing: border-box; margin-top: .25rem; padding: .5rem;
            border: 1px solid #C8CDC9; border-radius: 6px; font: inherit; }
    button { margin-top: 1.25rem; padding: .6rem 1.2rem; border: 0; border-radius: 6px;
             background: #0D6B59; color: #FFFFFF; font: inherit; cursor: pointer; }
    .request-text { white-space: pre-wrap; }
    .error { padding: .6rem .8rem; border-radius: 6px; background: #FDECEA; color: #B42318; }
    a { color: #0D6B59; }
  </style>
</head>
<body>
  <main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
